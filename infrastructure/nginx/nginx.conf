user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;

    # Cloudflare sits in front; trust its forwarded IPs.
    real_ip_header CF-Connecting-IP;

    # WebSocket upgrade (Next dev HMR); plain requests get a normal close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache-Control for pages proxied through `location /`: HTML must revalidate
    # on every load (no-cache), but an upstream no-store (personalised pages) is
    # stricter and is kept. Non-HTML responses pass the upstream header through.
    map $upstream_http_cache_control $html_cache_control {
        ~*no-store  $upstream_http_cache_control;
        default     "no-cache";
    }
    map $upstream_http_content_type $page_cache_control {
        ~*^text/html  $html_cache_control;
        default       $upstream_http_cache_control;
    }

    include /etc/nginx/conf.d/*.conf;
}
