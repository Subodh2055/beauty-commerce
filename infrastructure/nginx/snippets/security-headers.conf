# Security headers. nginx drops inherited add_header directives in any block
# that declares its own, so every location with an add_header includes this
# file too (see app-locations.conf). `always` sends them on errors as well.

add_header Strict-Transport-Security $hsts always;  # empty (not sent) over plain HTTP
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enforced: the directives that cannot break the app.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Report-only: the full policy. Next.js inlines bootstrap scripts, hence
# 'unsafe-inline'; promote to enforcing (or move to nonces) once reports are clean.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
