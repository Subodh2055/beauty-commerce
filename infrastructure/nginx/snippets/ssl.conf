# TLS settings for the HTTPS servers (Mozilla "intermediate" profile).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# HSTS is sent from security-headers.conf (via $hsts) so locations that set
# their own headers keep it too.
