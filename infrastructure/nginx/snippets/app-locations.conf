# Routing + cache headers shared by dev (dev/default.conf) and prod
# (conf.d/default.conf). Needs the api_upstream / web_upstream upstreams and the
# maps defined in nginx.conf.
#
# Cache headers are added without `always`, so they only apply to successful
# responses — a 404 never gets cached for a month.

client_max_body_size 20m;
limit_conn perip 50;

# Server-level headers for responses that don't hit a location with its own
# add_header (nginx would otherwise drop them there).
include /etc/nginx/snippets/security-headers.conf;

# Sign-in, registration and password resets: tight per-IP limit in front of the
# API's own per-endpoint limits.
location ^~ /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Request-ID $request_id;
}

# FastAPI. Only /api/v1: other /api/* paths are Next route handlers
# (e.g. /api/session, which mirrors the auth cookie).
location ^~ /api/v1/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Request-ID $request_id;
}

# Uploaded media, served by the API. Names are random UUIDs, never reused.
location ^~ /uploads/ {
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
}

# Next build output; filenames are content-hashed.
location ^~ /_next/static/ {
    proxy_pass http://web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Images: Next's optimiser and anything in public/.
location ^~ /_next/image {
    proxy_pass http://web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
}
location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
    proxy_pass http://web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
}

# Pages, RSC payloads, route handlers, and the dev HMR websocket.
location / {
    proxy_pass http://web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $page_cache_control;
}
