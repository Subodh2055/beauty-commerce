# Replace example.com with the real domain before deploying.
# TLS: terminate at Cloudflare (Full/Strict) with an origin certificate, or
# mount Let's Encrypt certs into /etc/letsencrypt via the certbot volume.

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8000; }
upstream n8n_upstream { server n8n:5678; }

server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /docs { return 404; }
    location /openapi.json { return 404; }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name n8n.example.com;

    location / {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
