# Production. Replace example.com with the real domain before deploying.
#
# TLS: either Let's Encrypt (scripts/init-letsencrypt.sh issues the first
# certificate; certbot renews into the certbot_certs volume), or Cloudflare
# Full (strict) with a Cloudflare origin certificate copied to the same paths.
# HTTP only redirects to HTTPS (and answers ACME challenges).

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8000; }
upstream n8n_upstream { server n8n:5678; }

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com n8n.example.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # API docs are for development only.
    location = /docs { return 404; }
    location = /openapi.json { return 404; }
    location = /api/v1/openapi.json { return 404; }

    include /etc/nginx/snippets/app-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://n8n_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
