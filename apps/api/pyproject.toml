[project]
name = "beauty-commerce-api"
version = "0.1.0"
description = "Beauty Commerce FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<1.21",
    "pgvector>=0.5,<0.6",
    "redis>=8.1,<9",
    "celery>=5.6,<6",
    "pyjwt>=2.14,<3",
    "pwdlib[argon2]>=0.3,<0.4",
    "structlog>=26.1,<27",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
